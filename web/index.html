<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint behind the notch and home indicator
         once it's launched from the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>GymTaxx</title>
    <meta name="description" content="Put money behind your weekly gym goal. Prove each workout, earn it back." />

    <meta property="og:title" content="GymTaxx" />
    <meta property="og:description" content="Put money behind your weekly gym goal. Prove each workout, earn it back." />
    <meta property="og:type" content="website" />

    <!-- The manifest link is written by the script below rather than sitting
         here, so iPhone only ever sees one. See the comment there. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- iOS reads these rather than the manifest for full-screen behaviour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymTaxx" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Phone numbers in dates/times must not turn into call links. -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <script>
      /* The creator demo installs as its own home screen app, with its own name
         and its own starting screen. Without this, installing from /demo hands
         the creator an icon that opens the real sign-up funnel.

         The manifest link is CREATED here instead of being declared in the HTML
         and then repointed. Repointing it — even at parse time — kept installing
         the real app: Safari binds the first manifest it sees while parsing, and
         changing the href afterwards is too late. So the document ships without
         a manifest link and this writes the only one, which means there is never
         a wrong manifest to be held onto.

         Runs synchronously during head parsing, so the link exists before the
         browser looks for it. */
      (function () {
        var isDemo = window.location.pathname.indexOf('/demo') === 0;

        var link = document.createElement('link');
        link.rel = 'manifest';
        link.id = 'app-manifest';
        link.href = isDemo ? '/demo.webmanifest' : '/manifest.webmanifest';
        document.head.appendChild(link);

        if (!isDemo) return;

        /* iOS reads these rather than the manifest for the icon's label. */
        var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appTitle) appTitle.setAttribute('content', 'GymTaxx Demo');
        document.title = 'GymTaxx Demo';
      })();
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1037615782556108');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1037615782556108&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <!-- Google Analytics 4. Loads only on the production domain — previews and
         local builds measure nothing. Automatic page views are disabled in the
         config because the app is an SPA: GaPageViewTracker sends exactly one
         page_view per screen, so GA4 never counts a duplicate. -->
    <script>
      if (window.location.hostname === 'app.gymtaxx.com') {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-D857WR9NBX', { send_page_view: false });
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-D857WR9NBX';
        document.head.appendChild(gaScript);
      }
    </script>

    <!-- Mouseflow session replay. Same production-domain guard as GA4 above,
         so preview and local builds are never recorded. -->
    <script>
      if (window.location.hostname === 'app.gymtaxx.com') {
        window._mfq = window._mfq || [];
        (function() {
          var mf = document.createElement('script');
          mf.type = 'text/javascript'; mf.defer = true;
          mf.src = '//cdn.mouseflow.com/projects/bd04154c-444a-4414-95b8-b37f4b6c19d4.js';
          document.getElementsByTagName('head')[0].appendChild(mf);
        })();
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
